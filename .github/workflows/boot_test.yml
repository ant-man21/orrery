name: Boot Tests

# Directly triggered on the same events as Build (pull_request, push to
# main) -- deliberately NOT workflow_run. workflow_run only fires for
# listener workflows that already exist on the default branch, and even
# once merged it's a separate, indirectly-chained event: it's easy for a
# PR to merge without anyone having actually seen whether this ran, or for
# the trigger relationship to silently fail to fire at all. Triggering
# directly means this always shows up as its own check on every PR and
# every push to main -- checkable, not assumable, and usable as a required
# branch-protection check like any other.
#
# The tradeoff: without a workflow_run event, there's no run id handed to
# us for the matching Build run, so the job below looks it up itself (by
# head SHA, via the GitHub API) and waits for it to finish -- still zero
# rebuilding, just found a different way to avoid it. See issue #34 on why
# rebuilding here instead of consuming Build's artifacts is the thing to
# avoid.
#
# Runs tests/test_boot.py: boots each platform headless and checks real
# boot-phase markers (SEC/DXE/BDS, or TF-A's BL1->BL32->BL33 chain for
# SBSA), and for Q35 drives a full TPM provision-and-lock cycle through a
# generated startup.nsh.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Build run ID to pull firmware artifacts from (optional -- leave blank to auto-find the run for this commit)"
        required: false

permissions:
  actions: read
  contents: read

jobs:
  boot:
    name: Boot + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 qemu-system-arm \
            mtools dosfstools swtpm \
            python3-pip
          python3 -m pip install pytest

      # Poll rather than assume Build has already finished: this workflow
      # and Build both fire off the same push/PR event, effectively
      # simultaneously, so Build's run for this exact commit may not exist
      # yet the moment this job starts. Distinguishes "not finished yet"
      # (keep polling) from "finished but failed" (stop and fail loudly --
      # don't boot-test a build that didn't succeed) from "never showed up"
      # (timeout and fail loudly, not hang forever).
      - name: Find and wait for the matching Build run
        id: find_build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.build_run_id }}" ]; then
            echo "id=${{ github.event.inputs.build_run_id }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Looking for a Build run at $SHA ..."

          for i in $(seq 1 60); do  # ~20 min at 20s/poll -- Build's slowest leg (SBSA -d) is the bound
            RUN_JSON=$(gh run list --repo "${{ github.repository }}" --workflow=build.yml \
              --json databaseId,headSha,status,conclusion --limit 50 \
              --jq "[.[] | select(.headSha==\"$SHA\")] | first(.[] | select(.status==\"completed\")) // empty")

            if [ -n "$RUN_JSON" ]; then
              CONCLUSION=$(echo "$RUN_JSON" | jq -r .conclusion)
              RUN_ID=$(echo "$RUN_JSON" | jq -r .databaseId)
              if [ "$CONCLUSION" = "success" ]; then
                echo "Build run $RUN_ID succeeded"
                echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
                exit 0
              else
                echo "::error::Build run $RUN_ID for $SHA finished with conclusion '$CONCLUSION' -- not running boot tests against it"
                exit 1
              fi
            fi

            sleep 20
          done

          echo "::error::No completed Build run found for $SHA after ~20 minutes"
          exit 1

      - name: Download q35 firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-q35
          path: .
          run-id: ${{ steps.find_build.outputs.id }}
          github-token: ${{ github.token }}

      - name: Download armvirt firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-arm-virt
          path: .
          run-id: ${{ steps.find_build.outputs.id }}
          github-token: ${{ github.token }}

      - name: Download sbsa firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-sbsa
          path: .
          run-id: ${{ steps.find_build.outputs.id }}
          github-token: ${{ github.token }}

      - name: Run boot pytest suite
        run: python3 -m pytest -v tests/

      - name: Upload boot logs (always, for debugging failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-debug-logs
          path: |
            Q35Pkg/debug.log
            Q35Pkg/tpm_provision.log
            ArmVirtOrreryPkg/debug.log
            SbsaOrreryPkg/debug.log
          if-no-files-found: ignore
          retention-days: 7
