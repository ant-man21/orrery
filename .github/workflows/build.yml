name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: q35
            script: Q35Pkg/build.sh
            args: -r -S
          - name: arm-virt
            script: ArmVirtOrreryPkg/build.sh
            args: -r
    steps:
      - name: Checkout orrery
        uses: actions/checkout@v4
        with:
          submodules: true

      # Only the nested edk2 submodules the platform DSCs actually need — not
      # `recursive`, which would also pull unrelated multi-hundred-MB
      # trees (libspdm's own vendored mbedtls/openssl/wycheproof/etc., TCG's
      # reference TPM, unit test frameworks) that this project's DSCs never
      # build against. This exact list was verified against a clean checkout,
      # not just a locally-already-populated sandbox — the .dec files below
      # fail workspace validation without each of these, whether or not the
      # corresponding library is actually linked into our components:
      #   - MdePkg.dec            -> MipiSysTLib/mipisyst
      #   - MdeModulePkg.dec      -> BrotliCustomDecompressLib/brotli
      #   - BaseTools' own build  -> Source/C/BrotliCompress/brotli (brotli
      #                              is vendored twice, at two different paths)
      #   - MdePkg/BaseFdtLib.inf -> BaseFdtLib/libfdt (ArmVirt only, but
      #                              cheap enough to always init)
      #   - CryptoPkg.dec         -> OpensslLib/openssl + MbedTlsLib/mbedtls
      #   - SecurityPkg.dec       -> DeviceSecurity/SpdmLib/libspdm (just the
      #                              top-level repo — its own nested
      #                              submodules aren't needed here)
      - name: Init required edk2 submodules
        run: |
          git -C edk2 submodule update --init \
            MdePkg/Library/MipiSysTLib/mipisyst \
            MdeModulePkg/Library/BrotliCustomDecompressLib/brotli \
            BaseTools/Source/C/BrotliCompress/brotli \
            MdePkg/Library/BaseFdtLib/libfdt \
            CryptoPkg/Library/OpensslLib/openssl \
            CryptoPkg/Library/MbedTlsLib/mbedtls \
            SecurityPkg/DeviceSecurity/SpdmLib/libspdm

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential uuid-dev iasl nasm python3 \
            gcc-x86-64-linux-gnu gcc-aarch64-linux-gnu \
            mtools

      - name: Build BaseTools
        run: make -C edk2/BaseTools -j"$(nproc)"

      - name: Build firmware (${{ matrix.name }})
        run: ./${{ matrix.script }} ${{ matrix.args }}

  # ---------------------------------------------------------------------------
  # Unit tests (issue #24) — the fast tier.
  #
  # Deliberately its own job, not a step in `build`: this needs no submodules,
  # no BaseTools, no cross-compilers, and finishes in seconds, so it should
  # report pass/fail on a PR long before a firmware build would. It also has to
  # stay green independently — a red here means the offline signing math is
  # wrong, which is a completely different problem from "the firmware won't
  # compile", and collapsing them into one check would hide that.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests (offline tooling)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout orrery
        uses: actions/checkout@v4
        # No submodules — tests/ only touches tools/*.py, and pulling edk2
        # here would cost minutes for nothing.

      - name: Install pytest
        run: python3 -m pip install --upgrade pytest

      - name: Run unit tests
        # openssl is already on GitHub's ubuntu images; the tools shell out to
        # it rather than depending on any pip package.
        run: python3 -m pytest tests/ -v

  # ---------------------------------------------------------------------------
  # Headless boot test (issue #25) — the slow tier, and the only check that
  # proves anything actually runs.
  #
  # `needs: build` so a compile break fails fast on the cheap job instead of
  # burning a full QEMU boot to rediscover it. Separate from `build` because
  # "does it compile" and "does it boot and provision against a real TPM" are
  # genuinely different questions — both real bugs found in #16 compiled fine.
  #
  # Phase is `provision`, not `all`, on purpose: the verify half currently
  # fails on main for a real reason (TpmVerifyBootApp was never brought onto
  # the PolicyAuthorize chain that #16 gated the NV index on — see the header
  # comment in tools/boot_test.sh). Widen this to --phase all once that lands;
  # doing it now would just wire up a permanently-red check nobody reads.
  # ---------------------------------------------------------------------------
  boot-test:
    name: Boot test (q35)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout orrery
        uses: actions/checkout@v4
        with:
          submodules: true

      # Same list, and same reasoning, as the build job above.
      - name: Init required edk2 submodules
        run: |
          git -C edk2 submodule update --init \
            MdePkg/Library/MipiSysTLib/mipisyst \
            MdeModulePkg/Library/BrotliCustomDecompressLib/brotli \
            BaseTools/Source/C/BrotliCompress/brotli \
            MdePkg/Library/BaseFdtLib/libfdt \
            CryptoPkg/Library/OpensslLib/openssl \
            CryptoPkg/Library/MbedTlsLib/mbedtls \
            SecurityPkg/DeviceSecurity/SpdmLib/libspdm

      # qemu-system-x86 + swtpm on top of the build deps. No KVM on GitHub
      # runners — this boots fully emulated under TCG, same as the developer
      # machine this project is normally run on (aarch64 host, x86 guest).
      - name: Install build + boot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential uuid-dev iasl nasm python3 \
            gcc-x86-64-linux-gnu mtools \
            qemu-system-x86 swtpm

      - name: Build BaseTools
        run: make -C edk2/BaseTools -j"$(nproc)"

      # Generates a throwaway keypair (rewriting the tracked
      # TrustedUpdateKey.h, which is fine and expected on a disposable
      # checkout), builds, boots headless, and greps the captured serial log.
      - name: Headless boot test
        run: ./tools/boot_test.sh --phase provision --timeout 300

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-logs
          path: Q35Pkg/boot-test-logs/
          if-no-files-found: warn
